<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />

    <title>Kanban — a small, fast board for personal and shared projects</title>
    <meta name="description" content="A small, fast kanban board for personal and shared projects. Drag-and-drop cards, markdown notes, and real-time sync." />
    <meta name="application-name" content="Kanban" />
    <link rel="canonical" href="https://kanban.cundus.my.id/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kanban" />
    <meta property="og:url" content="https://kanban.cundus.my.id/" />
    <meta property="og:title" content="Kanban — a small, fast board for personal and shared projects" />
    <meta property="og:description" content="A small, fast kanban board for personal and shared projects. Drag-and-drop cards, markdown notes, and real-time sync." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kanban — a small, fast board for personal and shared projects" />
    <meta name="twitter:description" content="A small, fast kanban board for personal and shared projects. Drag-and-drop cards, markdown notes, and real-time sync." />
    <script>
      // Applied before first paint. A theme flash is a bug, not a tradeoff. See DESIGN.md 5.8.
      try {
        var stored = localStorage.getItem("pk-theme");
        var dark = stored ? stored === "dark" : true;
        document.documentElement.classList.toggle("dark", dark);
      } catch (_) {
        /* private mode: keep the dark default already on <html> */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
